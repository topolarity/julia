    soname = "libgmpxx.so.4"
    deps = ["libgmp", "CompilerSupportLibraries_jll.libgcc_s"]

[[builds]]
os = "linux"
location = "bundled"

    [[builds.products]]
    name = "libgmp"
    type = "library"
