# Records the official Julia builds (the libgfortran-5 / GCC-12 era compiler
# support libraries). A Julia built against an older GCC would need matching
# sonames here; historical libgfortran majors are deliberately not enumerated.
format_version = "1.0"
name = "CompilerSupportLibraries"

[[builds]]
os = "windows"
location = "bundled"

    [[builds.products]]
    name = "libatomic"
    type = "library"
    linkage = "dynamic"
    soname = "libatomic-1.dll"

    [[builds.products]]
    name = "libquadmath"
    type = "library"
    linkage = "dynamic"
    soname = "libquadmath-0.dll"

    [[builds.products]]
    name = "libgcc_s"
    type = "library"
    linkage = "dynamic"
    soname = "libgcc_s_seh-1.dll"

    [[builds.products]]
    name = "libgfortran"
    type = "library"
    linkage = "dynamic"
    soname = "libgfortran-5.dll"
    deps = ["libgcc_s", "libquadmath"]

    [[builds.products]]
    name = "libstdcxx"
    type = "library"
    linkage = "dynamic"
    soname = "libstdc++-6.dll"
    deps = ["libgcc_s"]

    [[builds.products]]
    name = "libgomp"
    type = "library"
    linkage = "dynamic"
    soname = "libgomp-1.dll"
    deps = ["libgcc_s"]

    [[builds.products]]
    name = "libssp"
    type = "library"
    linkage = "dynamic"
    soname = "libssp-0.dll"

